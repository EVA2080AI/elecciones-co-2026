<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Paloma Valencia">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <radialGradient id="pglow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="url(#pg)"/>
  <circle cx="100" cy="80" r="120" fill="url(#pglow)"/>
  <!-- Decorative geometric pattern -->
  <g opacity="0.12" stroke="#fff" stroke-width="1.5" fill="none">
    <circle cx="100" cy="100" r="65"/>
    <circle cx="100" cy="100" r="50"/>
    <circle cx="100" cy="100" r="80"/>
  </g>
  <!-- Initials block -->
  <g transform="translate(100,108)">
    <text text-anchor="middle" font-family="Outfit, sans-serif" font-weight="800" font-size="68" fill="#fff" letter-spacing="-3">PV</text>
  </g>
  <!-- Name strip -->
  <rect x="0" y="170" width="200" height="30" fill="rgba(0,0,0,0.35)"/>
  <text x="100" y="190" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="13" fill="#fff" letter-spacing="0.5">PALOMA VALENCIA</text>
</svg>
